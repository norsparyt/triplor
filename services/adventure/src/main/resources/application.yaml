spring:
  application:
    name: adventure
  config:
    # Lets `./mvnw spring-boot:run` pick up the passwords from the repo-root .env during local development.
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${ADVENTURE_DB_URL:jdbc:postgresql://localhost:5433/adventure}
    username: ${ADVENTURE_DB_USER:adventure_app}
    password: ${ADVENTURE_DB_PASSWORD:}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # Do not keep a database connection open while the response is being written.
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are verified locally with identity's public key, fetched lazily from here.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          # A token must have been issued for this API, not for some other use of the same key.
          audiences: triplor-api

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

triplor:
  chat:
    # Where accept tells chat about new members. Temporary: an event replaces the call in Phase 2.
    base-url: ${CHAT_BASE_URL:http://localhost:8083}
  internal:
    # Shared with the chat service, which refuses the call without it.
    token: ${TRIPLOR_INTERNAL_TOKEN:}

springdoc:
  # The API description and Swagger UI are off by default and switched on by the `local` profile.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
