spring:
  application:
    name: identity
  config:
    # Lets `./mvnw spring-boot:run` pick up the passwords from the repo-root .env during local development.
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${IDENTITY_DB_USER:identity_app}
    password: ${IDENTITY_DB_PASSWORD:}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # Do not keep a database connection open while the response is being written.
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

triplor:
  security:
    public-paths:
      - /auth/**
      - /.well-known/**
  jwt:
    issuer: ${TRIPLOR_JWT_ISSUER:http://localhost:8081}
    audience: triplor-api
    # Created by `make keys`. Never committed.
    private-key-path: ${TRIPLOR_JWT_PRIVATE_KEY_PATH:../../.local/jwt-private.pem}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
