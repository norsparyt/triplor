name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the Postgres + PostGIS image
        run: docker build -t triplor/postgres:17 infra/docker/postgres
      - name: Build and test
        run: ./mvnw -B -ntp verify

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Existing lint infos and warnings are reported but do not fail the build yet.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
